{% extends 'studio/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow">Cấu hình</p>
    <h1>{{ title }}</h1>
  </div>
  <a class="btn ghost" href="{{ history_url }}">Lịch sử</a>
</header>
{% if lead %}<p class="help" style="margin-top:-8px;max-width:75ch">{{ lead }}</p>{% endif %}

<form method="post" novalidate>
  {% csrf_token %}
  <section class="card">
    {% include 'studio/partials/formset_table.html' with formset=formset %}
  </section>
  <div class="sticky-actions actions">
    <button type="submit" class="btn">Lưu</button>
  </div>
</form>
{% endblock %}
