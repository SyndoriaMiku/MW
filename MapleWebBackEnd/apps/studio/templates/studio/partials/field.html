{% if field.is_hidden %}{{ field }}{% else %}
<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} wide{% endif %}{% if choices %} choices{% endif %}" data-field="{{ field.html_name }}">
  {% if field.widget_type == 'checkbox' %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <b class="req">*</b>{% endif %}{% if unit %} <em class="unit">{{ unit }}</em>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
{% endif %}
